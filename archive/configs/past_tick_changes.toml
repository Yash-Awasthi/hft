# Published effects of past tick changes, used as the causal check of the regime forecast
# (DESIGN.md section 5). Changes relative to before (Tokyo) or to control stocks (Pilot).

[tokyo_2014_phase1]
source = "CMCRC (2014), via Mondo Visione 2014-10-28: TOPIX 100 tick reduction"
direction = "smaller"
effective_spread_bps_before = 14
effective_spread_bps_after = 9
depth = "decreased"

[tokyo_2014_phase2]
source = "CMCRC (2014), via Mondo Visione 2014-10-28: TOPIX 100 second reduction, July 2014"
direction = "smaller"
effective_spread_bps_before = 9
effective_spread_bps_after = 4
depth = "decreased"

[tick_size_pilot_tg1]
source = "Rindi and Werner (2019), U.S. Tick Size Pilot, test group 1 against controls"
direction = "larger"
tick_factor = 5
quoted_spread_change = 0.17
effective_spread_change = 0.46
depth_change = 2.75
